<h2>CATALOGO</h2>
<div class="catalogo">
  @for (producto of productos; track producto.nombre) {
    <div class="producto">
      <h2>{{ producto.nombre }}</h2>
      <p>
        Categoría: {{ producto.categoria }}
      </p>
      <p>
        Precio: ${{ producto.precio }}
      </p>
      @if (producto.precio > 100000) {
        <p>Producto costoso</p>
      }
    </div>
  }
</div>
